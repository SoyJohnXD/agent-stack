name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Run lib bash tests
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          for f in lib/*.test.sh; do
            echo "==> $f"
            bash "$f"
          done

      - name: Run agent-stack.test.sh
        if: runner.os != 'Windows'
        shell: bash
        continue-on-error: true
        run: bash agent-stack.test.sh

      - name: Run bootstrap.test.sh
        if: runner.os != 'Windows'
        shell: bash
        continue-on-error: true
        run: bash bootstrap.test.sh

      - name: Install Pester
        if: runner.os == 'Windows'
        shell: pwsh
        run: Install-Module Pester -Force -SkipPublisherCheck

      - name: Run Pester tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Import-Module Pester
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = '.'
          $cfg.Run.RecurseAll = $true
          $cfg.Output.Verbosity = 'Normal'
          Invoke-Pester -Configuration $cfg
